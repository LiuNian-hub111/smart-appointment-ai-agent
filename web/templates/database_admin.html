<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数据概览 - 物理辅导约课助手</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #243246; }
    nav a { margin-right: 18px; }
    section { padding: 18px; border: 1px solid #dce6f0; border-radius: 12px; margin: 20px 0; }
    .notice { color: #8a4a00; }
  </style>
</head>
<body>
  <nav><a href="/">聊天首页</a><a href="/admin">系统概览</a><a href="/knowledge">知识库</a></nav>
  <h1>本地数据概览</h1>
  <p class="notice">此页仅用于开发演示，尚未配置管理员登录。</p>
  {% if error %}<p class="notice">读取统计信息失败：{{ error }}</p>{% endif %}
  <section>
    <p>知识条目：{{ stats.knowledge_documents | default(0) }}</p>
    <p>知识分类：{{ stats.categories | default(0) }}</p>
    <p>演示老师：{{ stats.teachers | default(0) }}</p>
  </section>
</body>
</html>
